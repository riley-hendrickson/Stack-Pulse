spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.routes[0].id=query-api
spring.cloud.gateway.routes[0].uri=lb://query-api-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/keywords/**

spring.cloud.gateway.routes[1].id=scraper
spring.cloud.gateway.routes[1].uri=lb://scraper-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/scraper/**

spring.cloud.gateway.routes[2].id=swagger-ui
spring.cloud.gateway.routes[2].uri=lb://query-api-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/swagger-ui/**

spring.cloud.gateway.routes[3].id=swagger-docs
spring.cloud.gateway.routes[3].uri=lb://query-api-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/**

spring.main.allow-bean-definition-overriding=true
# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}